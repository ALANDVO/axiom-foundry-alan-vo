[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-foundry"
version = "1.0.0"
description = "Agent Harness Performance Optimization System"
authors = [{ name = "Alan Vo", email = "alanvo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.35",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "httpx==0.27.2",
  "python-multipart==0.0.11",
  "python-dotenv==1.0.1",
  "alembic==1.13.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.23.7",
  "pytest-httpx==0.30.0",
  "alembic==1.13.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]